// LibreQuake deathmatch server (FTEQW)
// Edit and redeploy, or mount over /srv/quake/lq1/server.cfg

hostname "LibreQuake Server"
sv_motd1 "Welcome to the LibreQuake Server"
maxclients 12
allow_download 1
sv_public 0               // 1 = list on public master servers

// map rotation
serverinfo lqdm1 lqdm2
serverinfo lqdm2 lqdm3
serverinfo lqdm3 lqdm4
serverinfo lqdm4 lqdm5
serverinfo lqdm5 lqdm6
serverinfo lqdm6 lqdm7
serverinfo lqdm7 lqdm8
serverinfo lqdm8 lqdm9
serverinfo lqdm9 lqdm10
serverinfo lqdm10 lqdm11
serverinfo lqdm11 lqdm12
serverinfo lqdm12 lqdm13
serverinfo lqdm13 lqdm1

serverinfo dq 1           // drop Crusher Sigil on death
fraglimit 15
timelimit 10
deathmatch 3
samelevel 0
sv_gamedir lq1
sv_mapcheck 0

map lqdm1
